<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d3330">
  <title>Tasbeeh</title>
  <meta name="description" content="A free tasbeeh counter with no ads. Count with a tap or the volume buttons.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="bar">
      <button class="dhikr-pick" id="pickBtn" aria-haspopup="dialog">
        <span class="pick-ar" id="pickAr"></span>
        <span class="pick-name" id="pickName"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <div class="bar-actions">
        <button class="icon" id="historyBtn" data-i18n-label="history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10h3v10H5zm5.5 0V4h3v16h-3zM16 20v-7h3v7h-3z"/></svg>
        </button>
        <button class="icon" id="settingsBtn" data-i18n-label="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4L10.6 6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </header>

    <!-- The whole stage counts a tap -->
    <main class="stage" id="stage" aria-live="polite">
      <div class="ring-wrap">
        <svg class="ring" id="ring" viewBox="0 0 400 400" aria-hidden="true"></svg>
        <div class="center">
          <div class="arabic" id="arabic" lang="ar" dir="rtl"></div>
          <div class="count" id="count">0</div>
          <div class="of" id="of"></div>
          <div class="meaning" id="meaning"></div>
        </div>
      </div>
      <div class="step" id="step"></div>
      <p class="tap-hint" id="tapHint"></p>
    </main>

    <footer class="controls">
      <button class="ctl" id="undoBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.7 0-5.1 1-7 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20.1 16l2.4-.8A10.5 10.5 0 0 0 12.5 8z"/></svg>
        <span data-i18n="undo"></span>
      </button>
      <button class="ctl" id="dimBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.3 3a9 9 0 1 0 8.7 11.3A7 7 0 0 1 12.3 3z"/></svg>
        <span data-i18n="dim"></span>
      </button>
      <button class="ctl hold" id="resetBtn">
        <span class="hold-fill" id="resetFill"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3z"/></svg>
        <span data-i18n="holdReset"></span>
      </button>
    </footer>
  </div>

  <!-- Dim mode: black screen, the whole screen still counts -->
  <div id="dim" class="dim hidden" aria-live="polite">
    <div class="dim-count" id="dimCount">0</div>
    <div class="dim-hint" data-i18n="dimHint"></div>
    <button class="dim-exit" id="dimExit" data-i18n="exitDim"></button>
  </div>

  <!-- Dhikr picker -->
  <div class="sheet-back hidden" id="pickSheet" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="pickTitle" data-i18n="chooseDhikr"></h2>
        <button class="icon close" data-close data-i18n-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
        </button>
      </div>
      <ul class="dhikr-list" id="dhikrList"></ul>
      <form class="add-form" id="addForm">
        <h3 data-i18n="addDhikr"></h3>
        <label><span data-i18n="name"></span><input id="addName" maxlength="60" required autocomplete="off"></label>
        <label><span data-i18n="target"></span><input id="addTarget" type="number" inputmode="numeric" min="1" max="100000" value="100" required></label>
        <button class="primary" type="submit" data-i18n="add"></button>
      </form>
    </div>
  </div>

  <!-- History -->
  <div class="sheet-back hidden" id="historySheet" role="dialog" aria-modal="true" aria-labelledby="histTitle">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="histTitle" data-i18n="history"></h2>
        <button class="icon close" data-close data-i18n-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
        </button>
      </div>
      <div id="historyBody"></div>
    </div>
  </div>

  <!-- Settings -->
  <div class="sheet-back hidden" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="setTitle" data-i18n="settings"></h2>
        <button class="icon close" data-close data-i18n-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
        </button>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="en">English</button>
        <button data-lang="ur" lang="ur">اردو</button>
      </div>
      <ul class="toggles" id="toggles"></ul>
      <p class="about" id="about"></p>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
