name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbeeh-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Pushing a tag like v1.0 publishes a GitHub Release with the APK attached,
      # so anyone can download it without a GitHub account.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tasbeeh-${GITHUB_REF_NAME}.apk
          # Fixed name, so the website can link to .../releases/latest/download/Tasbeeh.apk
          cp app/build/outputs/apk/debug/app-debug.apk Tasbeeh.apk
          gh release create "$GITHUB_REF_NAME" Tasbeeh.apk Tasbeeh-${GITHUB_REF_NAME}.apk \
            --title "Tasbeeh $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
